<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>MicroHazard</title>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: #081019; color: #e6f0ff; font-family: system-ui, sans-serif; }
      #app { width: 100vw; height: 100vh; position: relative; }
      canvas { width: 100%; height: 100%; display: block; touch-action: none; }
      .hud { position: absolute; left: 12px; top: 12px; background: rgba(0, 0, 0, 0.4); padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
      .game-over {
        position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.65);
      }
      .panel {
        background: #0e1d2f; border: 1px solid #335; border-radius: 10px; padding: 16px 20px; text-align: center;
      }
      button { background: #2f72ff; color: white; border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
